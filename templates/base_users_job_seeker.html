<!-- yourapp/templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}YourApp{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/user_base.css' %}">
    <link rel="stylesheet" href="{% static 'css/job_seeker_dashboard.css' %}">
</head>
<body>
    <header class="main-header">
        <div class="logo-section" style="display: flex; align-items: center;">
            <img src="/static/images/LogoBlack.png" alt="TF Logo" class="logo-img" style="height: 70px;" />
        </div>

        <nav class="nav-links" style="display: flex; gap: 1.5rem;">
            <a href="/job_seeker_dashboard/" className="active">Home</a>
            <a href="#">Profile</a>
            <a href="/my_applications/">Jobs applied</a>
            <a href="/job_search_page/">Search Job</a>
        </nav>

        <div class="user-controls" style="display: flex; align-items: center; gap: 0.5rem;">
            <button id="sign-out-button" class="btn btn-outline btn-sm d-flex align-items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="me-1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Sign Out
            </button>
        </div>
        </header>
    <!-- Main Content -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
                }
            }
            }
            return cookieValue;
        }

        document.getElementById("sign-out-button").addEventListener("click", async function () {
            const csrftoken = getCookie("csrftoken");
            if (!csrftoken) {
            alert("CSRF token not found");
            return;
            }

            try {
            const res = await fetch("/logout", {
                method: "POST",
                headers: {
                'X-CSRFToken': csrftoken
                }
            });

            if (res.ok) {
                window.location.href = "/login";
            } else {
                const error = await res.text();
                console.error("Logout failed:", error);
                alert("Logout failed");
            }
            } catch (err) {
            console.error("Logout error:", err);
            }
        });
        </script>
</body>
</html>
